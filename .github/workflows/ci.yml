name: CI

# Pull requests only run the checks. A push to main runs them and, if they pass,
# publishes the images to GHCR; the homelab picks them up on its own
# (~/Code/production/DevProfile/scripts/deploy.sh). Nothing here reaches the homelab,
# which matters because the repository is public.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Also generates the Prisma client, which lint and the tests need.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # Testcontainers starts its own Postgres with the runner's Docker.
      - run: pnpm test:e2e
      - run: pnpm build

  images:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: devprofile-api
            dockerfile: apps/api/Dockerfile
            target: runtime
          - name: devprofile-migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
          - name: devprofile-web
            dockerfile: apps/web/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/vitorpinhoalcantara/${{ matrix.name }}
          # `main` is what the homelab follows; the commit tag allows rolling back.
          tags: |
            type=raw,value=main
            type=sha,format=long,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
