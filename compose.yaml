name: devprofile

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      # The Cloudflare Zero Trust tunnel already points at this port (same as the old site).
      - '${PUBLIC_BIND:-0.0.0.0}:${PUBLIC_PORT:-7635}:80'
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: devprofile-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:?set REVALIDATE_TOKEN in .env}
      WEB_INTERNAL_URL: http://web:3000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: devprofile-migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      # The seed stores the project screenshots here.
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: devprofile-web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
      REVALIDATE_TOKEN: ${REVALIDATE_TOKEN:?set REVALIDATE_TOKEN in .env}
      # Public address, used for canonical links, sitemap and Open Graph.
      SITE_URL: ${SITE_URL:-http://localhost:7635}
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # Postgres 18 images keep data under a versioned subdirectory of this path.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  postgres_data:
  # Images uploaded through the admin (and the seed screenshots). Back this up with the database.
  uploads:
