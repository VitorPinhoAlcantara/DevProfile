packages:
  - apps/*
  - packages/*

# pnpm only runs dependency install scripts that are listed here.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: true
  # Optional native speedups pulled in by testcontainers (ssh2); the JS fallbacks are enough.
  cpu-features: false
  ssh2: false
  protobufjs: false
  # Ship prebuilt binaries through optional deps; install scripts aren't needed.
  '@parcel/watcher': false
  '@swc/core': false

# Security floors for transitive deps (GHSA-q7qp-rjg7-q26m, GHSA-7589-6fvf-x4pw).
overrides:
  multer: '^2.5.0'
  effect: '^3.22.1'
